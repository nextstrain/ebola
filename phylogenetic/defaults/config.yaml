
inputs:
  - name: ppx_open
    species: ebov
    metadata: "s3://nextstrain-data/files/workflows/ebola/ebov/metadata_open.tsv.zst"
    id_field: accession
    sequences: "s3://nextstrain-data/files/workflows/ebola/ebov/sequences_open.fasta.zst"
  - name: ppx_open
    species: bdbv
    metadata: "s3://nextstrain-data/files/workflows/ebola/bdbv/metadata_open.tsv.zst"
    id_field: accession
    sequences: "s3://nextstrain-data/files/workflows/ebola/bdbv/sequences_open.fasta.zst"
  - name: ppx_open
    species: sudv
    metadata: "s3://nextstrain-data/files/workflows/ebola/sudv/metadata_open.tsv.zst"
    id_field: accession
    sequences: "s3://nextstrain-data/files/workflows/ebola/sudv/sequences_open.fasta.zst"

builds:
   - bdbv/all-outbreaks
   - bdbv/drc-uganda-2026
   - sudv/all-outbreaks
   - ebov/all-outbreaks
   - ebov/west-africa-2014

nextclade:
  ebov:
    dataset-name: nextstrain/orthoebolavirus/ebov
    columns:
      - [clade, outbreak]
      - [qc.overallStatus, nextclade_qc]
      - [coverage, genome_coverage]
  bdbv:
    dataset-name: nextstrain/orthoebolavirus/bdbv
    columns:
      - [outbreak, outbreak]
      - [qc.overallStatus, nextclade_qc]
      - [coverage, genome_coverage]
  sudv:
    dataset-name: nextstrain/orthoebolavirus/sudv
    columns:
      - [qc.overallStatus, nextclade_qc]
      - [coverage, genome_coverage]

# See <https://docs.nextstrain.org/projects/augur/en/latest/usage/cli/subsample.html> for subsample
# config schema docs
subsample:
  ebov/all-outbreaks:
    samples:
      everything:
         min_length: 18000
         include: defaults/include_ebov_all-outbreaks.txt
         group_by: [outbreak, country, year]
         sequences_per_group: 25
         exclude_where: is_lab_host=true
  ebov/west-africa-2014:
    samples:
      outbreak:
        min_length: 18000
        include: defaults/include_ebov_west-africa-2014.txt
        group_by: [division, year, month]
        sequences_per_group: 30
        exclude_where: is_lab_host=true
        query: '(outbreak=="Ebov-2013" | outbreak=="Ebov-2013/r2021")'
  bdbv/all-outbreaks:
    samples:
      everything:
        min_length: 5000
        exclude_where:
          - nextclade_qc=bad
          - nextclade_qc=mediocre
        include: defaults/include_bdbv_all-outbreaks.txt
        exclude: defaults/exclude_bdbv_drc-uganda-2026.txt
        group_by: ['year', 'month']
        sequences_per_group: 25
  bdbv/drc-uganda-2026:
    samples:
      outbreak:
        # 80% of the 18940 nt genome. The nextclade_qc=bad exclusion already
        # floors coverage near this, so it drops few sequences; it is here to
        # make the floor explicit rather than incidental.
        min_length: 15152
        exclude_where:
          - outbreak!=Bdbv-2026
          - nextclade_qc=bad
        include: defaults/include_bdbv_drc-uganda-2026.txt
        exclude: defaults/exclude_bdbv_drc-uganda-2026.txt
  sudv/all-outbreaks:
    samples:
      everything:
        min_length: 5000
        exclude: defaults/exclude_sudv.txt

# Outgroup sequence to root the tree on, added before masking and pruned again by
# `reroot_tree`. Optional.
outgroup:
  bdbv/drc-uganda-2026:
    defaults/outgroup_bdbv_drc-uganda-2026.fasta

# per-build masking (optional)
mask:
  sudv/all-outbreaks: &generic-masking
    beginning: 50
    end: 50
  bdbv/all-outbreaks: &bdbv-masking
     beginning: 50
     end: 50
     sites: 7461 # a polymorphic site in a variable region in GP that conflicts with outgroup rooting.
  # `hard: true` keeps the masked sites masked downstream: `augur ancestral` reads
  # the masked alignment rather than the unmasked one, so masked positions stay
  # ambiguous instead of reappearing as mutations on branches of a tree that was
  # built without them. The outbreak's terminal 50 nt carried 12 such mutations
  # on a basal 3-tip branch whose only real substitution is T16608C.
  bdbv/drc-uganda-2026:
     beginning: 50
     end: 50
     hard: true

tree:
  bdbv/all-outbreaks: >-
    --override-default-args
    --tree-builder-args="--polytomy --ninit 100 --epsilon 0.01 -T AUTO --redo"
  # augur's default iqtree args plus --polytomy, which keeps zero-length branches
  # unresolved rather than picking an arbitrary resolution. The outbreak's base is
  # close to a star, so that distinction is the point of this build.
  bdbv/drc-uganda-2026: >-
    --tree-builder-args="--polytomy"

# per-build tree re-rooting (before refine). Optional.
reroot_tree:
  ebov/all-outbreaks:
    # See <https://virological.org/t/on-the-rooting-of-the-ebola-virus-phylogeny-and-its-consequences-for-understanding-the-diversity-in-the-reservoir/1005> for rooting approach
    strains: ['PP_000LE61', 'PP_000NUJS']
  bdbv/drc-uganda-2026:
    strains: ['all_outbreaks_inferred_root_no_masking']
    remove_outgroup: true

refine:
  ebov/all-outbreaks: >-
    --keep-root
  ebov/west-africa-2014: >-
    --timetree
    --date-inference marginal
    --coalescent skyline
    --date-confidence
  bdbv/all-outbreaks: >-
    --root mid_point
    --keep-polytomies
  sudv/all-outbreaks: >-
    --root mid_point
    --keep-polytomies
  # The ongoing BDBV outbreak tree has an initial refine step (detailed here)
  # and a second post-ADAR refine step (see below)
  #
  # Rooted on the old-BDBV outgroup by `reroot_tree` (above), which `--keep-root`
  # then preserves. Clock rooting is not robust here: the outbreak's basal splits
  # are 1-2 substitutions deep at sites that recur across the tree, so `--root
  # best` returns a different basal lineage on every resampling.
  bdbv/drc-uganda-2026: >-
    --timetree
    --keep-root
    --date-inference joint
    --keep-polytomies

refine_adar_mutations_removed:
  bdbv/drc-uganda-2026: >-
    --timetree
    --date-inference joint
    --date-confidence
    --keep-polytomies
    --keep-root
    --clock-filter-iqd 3
    --coalescent 0.0

# Enable ADAR-edit detection per build by providing the detection parameters.
# Both max_gap and min_count are required (there are no workflow-level defaults).
# Omit a build (or falsify it) to skip ADAR detection.
adar_mutations:
  bdbv/drc-uganda-2026:
    max_gap: 200   # max distance (nt) between consecutive edits within a cluster
    min_count: 3  # minimum number of edits required to call a cluster


# Ancestral per-build blocks may define 'inference' & 'root-sequence'
# Leave out (or falsify) a build to skip ancestral inference
ancestral:
  ebov/all-outbreaks: &ebov_ancestral
    genes: NP VP35 VP40 GP sGP ssGP VP30 VP24 L
    annotation: ../shared/zaire/reference.gb
  ebov/west-africa-2014:
    <<: *ebov_ancestral
  sudv/all-outbreaks:
    genes: NP VP35 VP40 GP sGP ssGP VP30 VP24 L
    annotation: ../shared/sudan/reference.gb
  bdbv/all-outbreaks:
    # no 'genes' key as we will reconstruct AA seqs via `augur translate`
    extra_args: "--keep-ambiguous"
  bdbv/drc-uganda-2026:
    # no 'genes' key as we will reconstruct AA seqs via `augur translate`
    extra_args: "--keep-ambiguous"

translate:
  # All other builds have translations via `augur ancestral` (above)
  bdbv/all-outbreaks:
    reference: ../shared/bdbv/reference.gb
    genes: NP VP35 VP40 GP GP_003 VP30 VP24 L
  bdbv/drc-uganda-2026:
    reference: ../shared/bdbv/reference.gb
    genes: NP VP35 VP40 GP GP_003 VP30 VP24 L


# Leave out (or falsify) a build to skip trait reconstruction
traits:
  ebov/west-africa-2014:
    columns: [country, division]
    confidence: true
  bdbv/drc-uganda-2026:
    columns: ['location_reconstructed', 'location_epicenter']
    bias: 2.5
    confidence: true

sampling_year_coloring:
  bdbv/all-outbreaks: true
  sudv/all-outbreaks: true
  ebov/all-outbreaks: true
  ebov/west-africa-2014: true

count_mutations:
  bdbv/drc-uganda-2026:
    counts: 0,1,2,3,4,5,6,7+
    cds: [GP]


label_outbreaks:
  ebov/all-outbreaks: true

# Export block:
# warning (string) takes precedence over warning_file (filename)
# per-build lat-longs can be provided which will be combined with the repo's hardcoded defaults/lat_longs.tsv
export:
  ebov/all-outbreaks:
    auspice_config: "defaults/auspice-config_ebov_all-outbreaks.json"
    description: defaults/description_ebov_all-outbreaks.md
    warning_file: defaults/warning_ebov_all-outbreaks.md

  ebov/west-africa-2014:
    auspice_config: defaults/auspice-config_ebov_west-africa-2014.json
    colors: defaults/colors-ebov-west-africa-2014.txt
    description: defaults/description_ebov_west-africa-2014.md
    warning_file: defaults/description_ebov_west-africa-2014.md # same file is both description & warning

  sudv/all-outbreaks:
    auspice_config: "defaults/auspice-config_sudv_all-outbreaks.json"
    description: ../nextclade/defaults/description.md

  bdbv/all-outbreaks:
    auspice_config: "defaults/auspice-config_bdbv_all-outbreaks.json"
    description: ../nextclade/defaults/description.md
    warning: &bdbv_warning >-
      This dataset sources RESTRICTED sequences from [Pathoplexus](https://pathoplexus.org/).
      Please see [virological](https://virological.org/t/initial-genomes-from-may-2026-bundibugyo-virus-disease-outbreak-in-the-democratic-republic-of-the-congo-and-uganda/1032) for more detail on the ongoing outbreak in DRC & Uganda.

  bdbv/drc-uganda-2026:
    auspice_config: "defaults/auspice-config_bdbv_drc-uganda-2026.json"
    description: ../nextclade/defaults/description.md
    warning: *bdbv_warning
